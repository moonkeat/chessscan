<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChessScan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.brown.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.cburnett.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar">
    <h1>ChessScan</h1>
    <p class="sub">Photograph a page, get a playable game.</p>
  </header>

  <main class="layout">
    <section class="panel input-panel">
      <label id="drop" class="drop">
        <input id="file" type="file" accept="image/*" multiple hidden>
        <span id="dropText">Drop page photos here, or click to choose.<br><small>Several pages of one game? Add them all, in any order.</small></span>
      </label>
      <div id="thumbs" class="thumbs"></div>
      <label class="field">Model
        <select id="backend">
          <option value="">Auto: local Ollama, then Gemini</option>
          <option value="ollama">Local Ollama only</option>
          <option value="gemini">Gemini only</option>
        </select>
      </label>
      <label class="check"><input id="translate" type="checkbox" checked> Translate commentary to English</label>
      <button id="extract" class="primary" disabled>Extract PGN</button>
      <div id="progress" class="progress" hidden>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span id="progressFill"></span>
        </div>
        <div class="progress-text"><span id="progressMsg">Starting…</span><span id="progressTime"></span></div>
      </div>
      <div id="status" class="status" role="status"></div>
    </section>

    <section class="panel viewer" id="viewer" hidden>
      <div class="game-head">
        <select id="gameSelect" hidden></select>
        <div id="players" class="players"></div>
        <div id="meta" class="meta"></div>
      </div>

      <div class="board-col">
        <div class="board-wrap">
          <div id="board" class="board" aria-label="Chess board"></div>
          <figure id="diagramBox" class="diagram-box" hidden>
            <img id="diagramImg" alt="">
            <figcaption id="diagramInfo"></figcaption>
          </figure>
        </div>
        <div class="controls">
          <button data-nav="start" title="Start (Home)">⏮</button>
          <button data-nav="prev" title="Previous (←)">◀</button>
          <button data-nav="next" title="Next (→)">▶</button>
          <button data-nav="end" title="End (End)">⏭</button>
          <button id="flip" title="Flip board">⇅</button>
          <button id="editMove" title="Replace the selected move (E)">✎</button>
        </div>
        <div id="editBar" class="edit-bar" hidden>
          <span>Replacing <b id="editTarget"></b>: play the right move on the board.</span>
          <button id="editCancel">Cancel</button>
        </div>
      </div>

      <div class="side-col">
        <div id="warnings" class="warnings" hidden></div>
        <div id="checks" class="checks" hidden></div>
        <div id="moves" class="moves"></div>
      </div>

      <details class="pgn-box">
        <summary>PGN</summary>
        <textarea id="pgn" spellcheck="false" rows="10"></textarea>
        <div class="row">
          <button id="apply">Apply edits</button>
          <button id="copy">Copy</button>
          <button id="download">Download .pgn</button>
        </div>
      </details>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>

</html>
